function drum(n,v){
 if(muted)return;
 try{
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const t=ctx.currentTime,vol=S.vol*(v||1);
  if(!noiseB){noiseB=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=noiseB.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1}
  const env=(g,a,dur)=>{g.gain.setValueAtTime(a*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur)};
  const osc=(f0,f1,dur,a)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);env(g,a,dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.02)};
  const noise=(type,f,dur,a)=>{const s=ctx.createBufferSource();s.buffer=noiseB;const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;const g=ctx.createGain();env(g,a,dur);s.connect(b);b.connect(g);g.connect(ctx.destination);s.start(t);s.stop(t+dur+.02)};
  if(n==="Kick")osc(150,40,.3,1);
  else if(n==="Snare"){osc(220,120,.12,.5);noise("highpass",1500,.2,.7)}
  else if(n==="Hi-hat")noise("highpass",7000,.07,.4);
  else if(n==="Clap")noise("bandpass",1500,.15,.8);
  else if(n==="Tom")osc(200,90,.3,.9);
  else noise("highpass",5000,.8,.35);
 }catch(e){}
}

function tdur(s){
 const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60,p=[];
 if(h)p.push(h+(h>1?" hours":" hour"));
 if(m)p.push(m+(m>1?" minutes":" minute"));
 if(r||!p.length)p.push(r+(r!==1?" seconds":" second"));

}

function tickTimers(){
 const now=Date.now();
 for(let k=timers.length-1;k>=0;k--){
  const t=timers[k],rem=Math.ceil((t.end-now)/1000);
  if(rem<=0){timers.splice(k,1);alarm(t);continue}
  let beep=false,ann=0;
  for(let s=t.last-1;s>=rem;s--){
   if(s>0&&s%60===0)beep=true;
   if(s>0&&(s%300===0||s===120||s===60))ann=s;
  }
  t.last=rem;
  if(beep&&beeps)tick(1300,.02);
  if(ann)sayPri(t.label+", "+tdur(ann)+" left");
 }
}

function parseCustom(){
 const b=cbuf.trim();if(!b)return null;
 if(/:|AM|PM/.test(b)){
  const m=b.match(/^(\d{1,2})(?::?(\d{2}))?\s*(AM|PM)?$/);if(!m)return null;
  const h=+m[1],mi=+(m[2]||0),ap=m[3];if(mi>59||h>24)return null;
  const now=new Date(),c=[];
  const hs=ap?[(h%12)+(ap==="PM"?12:0)]:(h>12||h===0)?[h%24]:[h%12,(h%12)+12];
  hs.forEach(hh=>[0,1].forEach(d=>{const t=new Date(now);t.setDate(t.getDate()+d);t.setHours(hh,mi,0,0);c.push(t)}));
  const t=c.filter(x=>x>now).sort((a,b)=>a-b)[0];if(!t)return null;
  const ts=t.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}),sec=Math.round((t-now)/1000);
  return {sec,label:"timer for "+ts,msg:"Timer set for "+ts+", that is in "+tdur(sec)};
 }
 if(!/^[\dhms ]+$/.test(b))return null;
 let sec=0,ok=false;
 for(const [r,mul] of [[/(\d+)\s*h/,3600],[/(\d+)\s*m/,60],[/(\d+)\s*s/,1]]){const m=b.match(r);if(m){sec+=m[1]*mul;ok=true}}

}
